name: Weekly ETL

on:
  # 1. Automatic data fetch: Daily at 4 AM UTC
  schedule:
    - cron: '0 4 * * *'
  
  # 2. CI/CD: Run whenever code changes on main or dev
  push:
    branches: [ main, dev ]
  
  # 3. Manual: The "Run Workflow" button for debugging
  workflow_dispatch:

jobs:
  run-etl:
    runs-on: ubuntu-latest
    
    # Variables defined here are inherited by all steps below
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      EBIRD_API_KEY: ${{ secrets.EBIRD_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Setup tables
        run: python run_pipeline.py setup

      - name: Extract (eBird API)
        run: python run_pipeline.py extract

      - name: Transform
        run: python run_pipeline.py transform

      - name: Load (PostGIS)
        run: python run_pipeline.py load

      # ------------------------------------------
      # DASHBOARD SUMMARY
      # ------------------------------------------
      - name: Generate Pipeline Report
        if: always()
        run: |
          echo "### ETL Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ job.status == 'success' && 'Success' || 'Failed' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **User:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Data Source:** eBird API" >> $GITHUB_STEP_SUMMARY
          echo "- **Database:** PostGIS (Production)" >> $GITHUB_STEP_SUMMARY
          echo ""
          echo "[View Full Logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY