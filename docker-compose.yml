version: '3.8'

services:
  db:
    # Swapped from postgres:15 to postgis (includes GDAL/Raster tools)
    image: postgis/postgis:15-3.4
    container_name: birdz_db
    environment:
      POSTGRES_DB: bird_db
      POSTGRES_USER: bird_user
      POSTGRES_PASSWORD: password12345
      # Required for Point 3: enables the database to handle GeoTIFF files
      POSTGRES_REPOSTGIS_RASTER: "true" 
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Map a local folder so you can drop GeoTIFFs here to be processed
      - ./rasters:/tmp/rasters 

  pgadmin:
    image: dpage/pgadmin4
    container_name: birdz_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: william@birdz.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    depends_on:
      - db

volumes:
  pg_data: