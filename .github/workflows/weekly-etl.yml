name: Weekly ETL

on:
  schedule:
    - cron: '0 4 * * *'
  push:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  run-etl:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      EBIRD_API_KEY: ${{ secrets.EBIRD_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Setup Tables
        run: python run_pipeline.py setup

      - name: Extract
        run: python run_pipeline.py extract

      - name: Transform
        run: python run_pipeline.py transform

      - name: Load
        run: python run_pipeline.py load

      - name: Generate Pipeline Report
        if: always()
        run: |
          echo "### ETL Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ job.status == 'success' && 'Success' || 'Failed' }}" >> $GITHUB_STEP_SUMMARY